<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manual de reparació de cotxes clàssics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PORTADA
    ========================== -->

    <section id="cover" class="cover-screen">

        <!-- Efectes de fons -->
        <div class="garage-light"></div>
        <div class="garage-grid"></div>

        <!-- Part superior -->
        <div class="cover-top">
            <span>PROJECTE DE RESTAURACIÓ</span>
            <span>1985 · CLASSIC CAR</span>
        </div>

        <!-- Decoració -->
        <div class="red-line"></div>

        <!-- Cotxe decoratiu -->
        <div class="car-decoration">

            <div class="car-body">

                <div class="car-roof"></div>

                <div class="car-window front-window"></div>
                <div class="car-window back-window"></div>

                <div class="car-light left-light"></div>
                <div class="car-light right-light"></div>

                <div class="car-bumper"></div>

                <div class="wheel left-wheel">
                    <div class="wheel-center"></div>
                </div>

                <div class="wheel right-wheel">
                    <div class="wheel-center"></div>
                </div>

            </div>

        </div>

        <!-- Contingut principal -->
        <div class="cover-content">

            <div class="project-label">
                SEAT FURA 900
            </div>

            <h1>
                MANUAL DE<br>
                <span>REPARACIÓ</span>
            </h1>

            <p class="cover-subtitle">
                Guia de diagnosi i restauració<br>
                de cotxes clàssics
            </p>

            <button class="start-button" onclick="startManual()">
                <span>COMENÇAR</span>
                <span class="arrow">→</span>
            </button>

        </div>

        <!-- Peu -->
        <div class="cover-bottom">
            <span>RESTAURACIÓ · DIAGNOSI · MECÀNICA</span>
            <span>MANUAL TÈCNIC</span>
        </div>

    </section>


    <!-- =========================
         MANUAL
    ========================== -->

    <main id="manual" class="screen hidden">

        <header>

            <p class="project-title">
                MANUAL DE REPARACIÓ
            </p>

            <div class="progress-container">
                <span id="progress">
                    Pregunta 1 de 28
                </span>
            </div>

        </header>

        <section id="content"></section>

    </main>


    <script src="script.js"></script>

</body>
</html>
