<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manual de reparació de cotxes clàssics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         PORTADA
    ========================== -->

    <section id="cover" class="cover-screen">

        <div class="cover-background"></div>
        <div class="cover-overlay"></div>

        <div class="cover-top">
            <span>PROJECTE DE RESTAURACIÓ</span>
            <span>SEAT FURA 900 · 1985</span>
        </div>

        <div class="red-line"></div>

        <div class="cover-content">

            <div class="project-label">
                MANUAL TÈCNIC
            </div>

            <h1>
                MANUAL DE<br>
                <span>REPARACIÓ</span>
            </h1>

            <p class="cover-subtitle">
                Guia de diagnosi i restauració<br>
                de cotxes clàssics
            </p>

            <button
                class="start-button"
                onclick="startManual()">

                <span>COMENÇAR</span>

                <span class="arrow">→</span>

            </button>

        </div>

        <div class="cover-bottom">

            <span>
                DIAGNOSI · MECÀNICA · RESTAURACIÓ
            </span>

            <span>
                TDR
            </span>

        </div>

    </section>


    <!-- =========================
         MANUAL
    ========================== -->

    <main id="manual" class="screen hidden">

        <header>

            <p class="project-title">
                MANUAL DE REPARACIÓ
            </p>

            <div class="progress-container">

                <span id="progress">
                    Pregunta 1 de 28
                </span>

            </div>

        </header>

        <section id="content"></section>

    </main>


    <script src="script.js"></script>

</body>

</html>
